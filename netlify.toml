[build]
  command = "vite build"
  publish = "dist"

# Redirecionamento permanente 301 do antigo serviço de alarme monitorado
[[redirects]]
  from = "/servicos/alarme-monitorado"
  to = "/servicos/instalacao-de-alarmes"
  status = 301
  force = true

# Redirecionamentos permanentes 301 para aluguel de câmeras de segurança
[[redirects]]
  from = "/servicos/locacao-de-cameras-de-seguranca"
  to = "/servicos/aluguel-de-cameras-de-seguranca"
  status = 301
  force = true

[[redirects]]
  from = "/servicos/locacao-de-equipamentos-de-seguranca"
  to = "/servicos/aluguel-de-cameras-de-seguranca"
  status = 301
  force = true

[[redirects]]
  from = "/servicos/locacao-de-equipamentos"
  to = "/servicos/aluguel-de-cameras-de-seguranca"
  status = 301
  force = true

# Redirecionamento permanente 301 para portão automático
[[redirects]]
  from = "/servicos/portao-eletronico"
  to = "/servicos/portao-automatico"
  status = 301
  force = true

# Redirecionamento permanente 301 para fechaduras eletrônicas
[[redirects]]
  from = "/servicos/fechaduras-eletromagneticas"
  to = "/servicos/fechaduras-eletronicas"
  status = 301
  force = true

# Redirecionamento permanente 301 para compra x aluguel de câmeras
[[redirects]]
  from = "/comparativos/compra-x-locacao-de-equipamentos"
  to = "/comparativos/compra-x-aluguel-de-cameras"
  status = 301
  force = true

[[redirects]]
  from = "/depoimentos"
  to = "/"
  status = 301
  force = true

# Fallback para Single Page Application (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos globais de segurança e proteção HSTS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache agressivo e otimizado para arquivos estáticos compilados pelo Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
