<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C5FF" />
      <stop offset="100%" stop-color="#0081E6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="240" rx="16" fill="#0A0D14" />
  
  <g transform="translate(50, 40)">
    <!-- Shield Icon -->
    <path d="M40 10 L80 30 V70 C80 100 50 120 40 125 C30 120 0 100 0 70 V30 Z" fill="url(#blueGrad)" />
    <path d="M40 25 L65 40 V65 C65 85 45 100 40 105 C35 100 15 85 15 65 V40 Z" fill="#0A0D14" />
    <!-- Camera Eye inside shield -->
    <circle cx="40" cy="60" r="12" fill="url(#blueGrad)" />
    <circle cx="40" cy="60" r="6" fill="#0A0D14" />
    
    <!-- Text Group -->
    <text x="105" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" letter-spacing="-1.5">
      <tspan fill="url(#blueGrad)">Intel</tspan><tspan fill="url(#blueGrad)">Sec</tspan><tspan fill="#FFFFFF">Sul</tspan>
    </text>
    <text x="108" y="115" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18" fill="#94A3B8" letter-spacing="4">
      SEGURANÇA ELETRÔNICA
    </text>
  </g>
</svg>